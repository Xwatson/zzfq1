<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>专注番茄</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #fdf6f0;
      --fg: #2b2b2b;
      --accent: #d9480f;
      --muted: #868e96;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .app { text-align: center; padding: 2rem; }
    .app h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1.5rem; }
    .status {
      display: inline-block;
      padding: .25rem .75rem;
      border-radius: 999px;
      font-size: .875rem;
    }
    .time {
      font-size: 5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin: 1rem 0 1.5rem;
    }
    .controls { display: flex; gap: .75rem; justify-content: center; }
    .controls button {
      font: inherit;
      padding: .5rem 1.25rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: #fff;
      color: var(--accent);
      cursor: pointer;
    }
    .controls button.primary { background: var(--accent); color: #fff; }
    .controls button:disabled { opacity: .4; cursor: not-allowed; }

    /* 状态 class 挂在 .app 上,由后续工作项切换 */
    .app.is-idle .status    { background: #e9ecef; color: var(--muted); }
    .app.is-running .status { background: #ffe8cc; color: var(--accent); }
    .app.is-paused .status  { background: #e7f5ff; color: #1971c2; }
  </style>
</head>
<body>
  <main id="app" class="app is-idle">
    <h1>专注番茄</h1>
    <span id="status" class="status">未开始</span>
    <div id="time" class="time" aria-live="polite">--:--</div>
    <div class="controls">
      <button id="btn-start" class="primary" type="button">开始</button>
      <button id="btn-reset" type="button" disabled>重置</button>
    </div>
  </main>

  <script src="pomodoro-core.js"></script>
  <script>
    'use strict';
    (function () {
      var P = window.Pomodoro;
      if (!P) {
        console.error('pomodoro-core.js 未加载，请确认它和 index.html 在同一目录');
        return;
      }
      var timeEl = document.getElementById('time');
      var startBtn = document.getElementById('btn-start');

      var state = P.createIdleState();
      var timerId = null;

      function render() {
        timeEl.textContent = P.formatTime(P.getRemainingMs(state, Date.now()));
        // 计时中「开始」按钮变为「暂停」
        startBtn.textContent = state.status === 'running' ? '暂停' : '开始';
      }

      // 走完一个番茄:停表并停在 00:00。集中在这里，方便后续工作项复用
      function finish() {
        clearTimeout(timerId);
        timerId = null;
        state = P.finishTimer();
        render();
      }

      // 定时器只负责刷新显示：每次在剩余秒数变化后稍晚一点触发，避免漂移导致跳秒
      function tick() {
        var now = Date.now();
        if (P.isFinished(state, now)) {
          finish();
          return;
        }
        render();
        var remaining = P.getRemainingMs(state, now);
        var delay = remaining % 1000 || 1000;
        timerId = setTimeout(tick, delay + 20);
      }

      startBtn.addEventListener('click', function () {
        if (state.status === 'running') {
          // 暂停逻辑由 ZZF111-3 实现
          return;
        }
        state = P.startTimer(Date.now());
        tick();
      });

      render();
    })();
  </script>
</body>
</html>
